name: Release

# Every push to main automatically bumps the patch version, builds, tests, packages a
# .vsix, and creates a GitHub release — so a merge to main IS the release process.
# Pushing a v* tag by hand still works, and the manual trigger exists to (re)release
# a tag that predates this workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.4'
        required: true

permissions:
  # The built-in token may create tags, releases, and push version bumps.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the release job for commits whose message starts with "chore: bump version"
    # — those are the automated version-bump commits from this very workflow.
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          # Fetch full history so git push works for the version bump commit.
          fetch-depth: 0
          # Use the built-in token (has push permissions via `contents: write`).
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      # ── Auto-bump version on main push ───────────────────────
      - name: Bump patch version
        id: bump
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          # npm version patch: increments 0.1.4 → 0.1.5, commits, and tags.
          # --no-git-tag-version: we create the tag ourselves via gh release.
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD_VERSION → $NEW_VERSION"

      - name: Commit version bump
        if: steps.bump.outputs.new != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }}"
          git push origin main

      # ── Determine version for tag/manual triggers ────────────
      - name: Determine the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # An ordinary main push without a version bump lands here with a tag that is
          # already released — every later step is skipped rather than failed, so the
          # commit stays green and no duplicate release is attempted.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches package.json version
        if: steps.version.outputs.new == 'true' && github.ref_type == 'tag'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ steps.version.outputs.tag }}" != "v$VERSION" ]; then
            echo "Tag ${{ steps.version.outputs.tag }} does not match package.json version $VERSION." >&2
            echo "Bump the version, commit, and re-tag so the release and the artifact agree." >&2
            exit 1
          fi

      # ── Install, test, package ───────────────────────────────
      # No npm workspaces: the webview is its own package and needs its own install.
      - run: npm ci
        if: steps.version.outputs.new == 'true'
      - run: npm ci --prefix webview-ui
        if: steps.version.outputs.new == 'true'

      # A release that skipped the tests would defeat the point of having them.
      - run: npm run typecheck
        if: steps.version.outputs.new == 'true'
      - run: npm test
        if: steps.version.outputs.new == 'true'

      - name: Package
        if: steps.version.outputs.new == 'true'
        run: npx --yes @vscode/vsce package

      # ── Create GitHub release with the .vsix ─────────────────
      - name: Publish GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # For a main push the tag does not exist yet; gh creates it at this commit
          # together with the release. Re-runs fall through to replacing the asset.
          gh release create "$TAG" repo-intelligence-*.vsix \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" || \
          gh release upload "$TAG" repo-intelligence-*.vsix --clobber
